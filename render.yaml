services:
  - type: web
    name: cerberus-demo
    runtime: python
    plan: free
    buildCommand: pip install -r requirements-render-free.txt
    startCommand: gunicorn app:app --bind 0.0.0.0:$PORT --workers 1 --threads 4 --timeout 120
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: CERBERUS_SECRET_KEY
        generateValue: true
      - key: CERBERUS_DATA_DIR
        value: /tmp/cerberus-data
      - key: CERBERUS_DEMO_MODE
        value: "1"
