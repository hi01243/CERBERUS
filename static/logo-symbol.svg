<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800" width="100%" height="100%">
  <defs>
    <!-- Background Radial Gradient -->
    <radialGradient id="bgMark" cx="50%" cy="50%" r="70%">
      <stop offset="0%" stop-color="#0f192b"/>
      <stop offset="70%" stop-color="#080e18"/>
      <stop offset="100%" stop-color="#03060a"/>
    </radialGradient>

    <!-- Cobalt to Sky Gradient -->
    <linearGradient id="azureGradMark" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#60a5fa"/>
      <stop offset="60%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#1d4ed8"/>
    </linearGradient>

    <filter id="markGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3.5" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background Canvas -->
  <rect width="800" height="800" rx="28" fill="url(#bgMark)"/>

  <!-- Centered Optical Calibration Reticles -->
  <circle cx="400" cy="400" r="310" fill="none" stroke="#1e293b" stroke-width="1.2" stroke-dasharray="4 6"/>
  <circle cx="400" cy="400" r="350" fill="none" stroke="#101926" stroke-width="1"/>

  <!-- Centered Cerberus Glyph -->
  <g transform="translate(-100, 0)" filter="url(#markGlow)">
    <!-- Outer Shield Boundary -->
    <path d="M 500 130 L 730 250 L 660 520 L 500 680 L 340 520 L 270 250 Z" 
          fill="none" stroke="#2563eb" stroke-width="2.5" stroke-linejoin="round" opacity="0.35"/>

    <!-- Left Sentinel (Perimeter Scan Left) -->
    <path d="M 390 320 L 350 200 L 310 320 L 240 370 L 310 430 L 380 430 L 430 490" 
          fill="none" stroke="url(#azureGradMark)" stroke-width="5.5" stroke-linejoin="round" stroke-linecap="round"/>
    <circle cx="315" cy="365" r="4.5" fill="#38bdf8"/>
    <line x1="315" y1="365" x2="350" y2="365" stroke="#38bdf8" stroke-width="2.2" stroke-linecap="round"/>

    <!-- Right Sentinel (Perimeter Scan Right) -->
    <path d="M 610 320 L 650 200 L 690 320 L 760 370 L 690 430 L 620 430 L 570 490" 
          fill="none" stroke="url(#azureGradMark)" stroke-width="5.5" stroke-linejoin="round" stroke-linecap="round"/>
    <circle cx="685" cy="365" r="4.5" fill="#38bdf8"/>
    <line x1="685" y1="365" x2="650" y2="365" stroke="#38bdf8" stroke-width="2.2" stroke-linecap="round"/>

    <!-- Center Forward Sentinel -->
    <path d="M 450 290 L 465 170 L 500 240 L 535 170 L 550 290" 
          fill="none" stroke="#ffffff" stroke-width="6" stroke-linejoin="round" stroke-linecap="round"/>
    <path d="M 450 290 L 420 370 L 470 470 L 500 520 L 530 470 L 580 370 L 550 290" 
          fill="none" stroke="#ffffff" stroke-width="6" stroke-linejoin="round" stroke-linecap="round"/>
    <line x1="500" y1="240" x2="500" y2="440" stroke="#38bdf8" stroke-width="3" stroke-linecap="round"/>

    <!-- Center Optical Target Sensors -->
    <polygon points="460,335 480,340 470,350" fill="#38bdf8"/>
    <polygon points="540,335 520,340 530,350" fill="#38bdf8"/>

    <!-- Lower Chevrons -->
    <path d="M 430 520 L 500 600 L 570 520" fill="none" stroke="url(#azureGradMark)" stroke-width="5" stroke-linejoin="round" stroke-linecap="round"/>
    <path d="M 460 580 L 500 630 L 540 580" fill="none" stroke="#38bdf8" stroke-width="3.5" stroke-linejoin="round" stroke-linecap="round"/>
  </g>
</svg>
