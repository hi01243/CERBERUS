<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CERBERUS - Incident review</title>
<style>
  :root { --bg:#12141a; --panel:#1b1f28; --line:#2c3240; --text:#e7e9ee; --muted:#8e97a8; --flag:#f2b134; }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--bg); color:var(--text); font:14px/1.45 system-ui, sans-serif; }
  header { display:flex; justify-content:space-between; align-items:center; padding:14px 20px; border-bottom:1px solid var(--line); }
  header h1 { margin:0; font-size:16px; font-weight:600; }
  button, header a { background:var(--panel); color:var(--text); border:1px solid var(--line); border-radius:6px; padding:6px 12px; font:inherit; text-decoration:none; cursor:pointer; }
  button:focus-visible, .card:focus-visible, .mark:focus-visible { outline:2px solid var(--flag); outline-offset:2px; }
  main { display:grid; grid-template-columns:minmax(0,1fr) 360px; gap:16px; padding:16px 20px; }
  @media (max-width:900px) { main { grid-template-columns:1fr; } }
  video { width:100%; max-height:62vh; background:#000; border-radius:8px; }
  #timeline { position:relative; height:28px; margin-top:10px; background:var(--panel); border:1px solid var(--line); border-radius:6px; }
  .mark { position:absolute; top:4px; bottom:4px; min-width:5px; background:var(--flag); border:0; padding:0; border-radius:2px; }
  #note { color:var(--muted); margin:8px 0 0; min-height:1.4em; }
  #list { display:flex; flex-direction:column; gap:8px; max-height:82vh; overflow:auto; }
  .card { display:flex; gap:10px; padding:8px; background:var(--panel); border:1px solid var(--line); border-radius:6px; cursor:pointer; }
  .card[aria-current="true"] { border-color:var(--flag); }
  .card img { width:112px; height:63px; object-fit:cover; border-radius:4px; background:#000; flex:none; }
  .type { font-weight:600; }
  .meta { color:var(--muted); font-size:12px; }
</style>
</head>
<body>
<header>
  <h1>Incident review</h1>
  <div><button id="refresh">Refresh</button> <a href="/">Dashboard</a></div>
</header>
<main>
  <section>
    <video id="player" controls preload="metadata"></video>
    <div id="timeline" aria-label="Incidents in this recording"></div>
    <p id="note">Select an incident to play its recording from 5 seconds before the alert.</p>
  </section>
  <section id="list" aria-label="Incidents"></section>
</main>
<script>
const LEAD_IN = 5;
const player = document.getElementById('player');
const listEl = document.getElementById('list');
const timeline = document.getElementById('timeline');
const note = document.getElementById('note');
let incidents = [], current = null;

const fmt = s => `${Math.floor(s / 60)}:${String(Math.floor(s % 60)).padStart(2, '0')}`;
const label = t => t.replaceAll('_', ' ').toLowerCase();

async function load() {
  incidents = await (await fetch('/incidents')).json();
  listEl.innerHTML = '';
  if (!incidents.length) { listEl.textContent = 'No incidents recorded for this session.'; }
  for (const inc of incidents) {
    const card = document.createElement('div');
    card.className = 'card';
    card.tabIndex = 0;
    card.dataset.id = inc.id;
    const dur = Math.max(1, Math.round(inc.end_offset - inc.start_offset));
    card.innerHTML = `<img src="${inc.thumb_url || ''}" alt="">
      <div><div class="type">${label(inc.violation_type)}</div>
      <div class="meta">${inc.camera_id}${inc.track_id != null ? ', student ' + inc.track_id : ''}</div>
      <div class="meta">at ${fmt(inc.start_offset)}, lasted ${dur}s, confidence ${Math.round(inc.confidence * 100)}%</div></div>`;
    card.onclick = () => openIncident(inc);
    card.onkeydown = e => { if (e.key === 'Enter') openIncident(inc); };
    listEl.appendChild(card);
  }
  // Deep link from the dashboard: /review?thumb=<evidence image path>
  const want = new URLSearchParams(location.search).get('thumb');
  if (want && !player.getAttribute('src')) {
    const hit = incidents.find(i => i.thumb === want);
    if (hit) openIncident(hit);
  }
}

function openIncident(inc) {
  current = inc;
  for (const c of listEl.children) c.setAttribute('aria-current', String(c.dataset.id == inc.id));
  if (!inc.video_url) { note.textContent = 'This incident has no recording.'; return; }
  note.textContent = '';
  const seek = () => { player.currentTime = Math.max(0, inc.start_offset - LEAD_IN); player.play().catch(() => {}); };
  if (player.src.endsWith(inc.video_url)) { seek(); }
  else {
    player.addEventListener('loadedmetadata', seek, { once: true });
    player.src = inc.video_url;
  }
  drawTimeline();
}

function drawTimeline() {
  timeline.innerHTML = '';
  if (!current || !player.duration) return;
  for (const inc of incidents.filter(i => i.recording === current.recording)) {
    const m = document.createElement('button');
    m.className = 'mark';
    m.title = `${label(inc.violation_type)} at ${fmt(inc.start_offset)}`;
    m.style.left = (inc.start_offset / player.duration * 100) + '%';
    m.style.width = (Math.max(1, inc.end_offset - inc.start_offset) / player.duration * 100) + '%';
    m.onclick = () => openIncident(inc);
    timeline.appendChild(m);
  }
}

player.addEventListener('loadedmetadata', drawTimeline);
player.addEventListener('error', () => {
  note.textContent = 'This recording cannot be played yet. It may still be processing after PAUSE, or the browser may not support its codec (install ffmpeg to fix this).';
});
document.getElementById('refresh').onclick = load;
load();
</script>
</body>
</html>
