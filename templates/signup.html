<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CERBERUS - Create account</title>
<link rel="icon" type="image/svg+xml" href="{{ url_for('static', filename='logo-symbol.svg') }}">
<style>
  body { margin:0; min-height:100vh; display:flex; align-items:center; justify-content:center;
         background:#12141a; color:#e7e9ee; font:15px/1.5 system-ui, sans-serif; }
  form { background:#1b1f28; border:1px solid #2c3240; border-radius:8px; padding:28px 30px; width:min(340px, calc(100vw - 32px)); }
  h1 { font-size:15px; letter-spacing:.08em; margin:0 0 4px; }
  p.sub { color:#8e97a8; margin:0 0 18px; font-size:12.5px; }
  label { display:block; font-size:12px; color:#8e97a8; margin-bottom:6px; }
  input { width:100%; box-sizing:border-box; padding:9px 10px; border-radius:6px; border:1px solid #2c3240;
          background:#12141a; color:#e7e9ee; font:inherit; margin-bottom:14px; }
  input#invite_code { font-family: JetBrains Mono, monospace; }
  .hint { color:#6b7280; font-size:11.5px; margin:-10px 0 14px; }
  .option { display:flex; align-items:flex-start; gap:9px; margin:0 0 14px; color:#c1c7d0; font-size:12px; }
  .option input { width:16px; height:16px; flex:none; margin:2px 0 0; accent-color:#f2b134; }
  .option span { display:block; }
  button { width:100%; padding:9px; border-radius:6px; border:0; background:#f2b134; color:#12141a;
           font:inherit; font-weight:600; cursor:pointer; }
  .error { color:#ff6b6b; font-size:12.5px; margin:-8px 0 14px; }
  .alt { text-align:center; margin-top:14px; font-size:12.5px; color:#8e97a8; }
  .alt a { color:#f2b134; text-decoration:none; }
</style>
</head>
<body>
  <form method="post">
    <img src="{{ url_for('static', filename='logo-symbol.svg') }}" alt="" height="44" style="display:block;height:44px;width:auto;margin:0 0 10px">
    <h1>CERBERUS</h1>
      <p class="sub">Create a proctor account</p>
    {% if error %}<p class="error">{{ error }}</p>{% endif %}
      <label for="username">Username</label>
      <input type="text" id="username" name="username" autocomplete="username" autofocus required
           minlength="3" maxlength="32" pattern="[A-Za-z0-9_.\-]+"
           value="{{ request.form.get('username', '') }}">
      <p class="hint">3-32 characters: letters, numbers, _ . -</p>
    <label for="password">Password</label>
    <input type="password" id="password" name="password" autocomplete="new-password" required minlength="8">
    <p class="hint">At least 8 characters.</p>
    <p class="hint">Use the code printed when CERBERUS starts, or ask whoever runs it. The code stays the same across restarts.</p>
    <label class="option" for="enable_mfa">
      <input type="checkbox" id="enable_mfa" name="enable_mfa" value="1">
      <span>Enable authenticator MFA for sign-in and to confirm session deletions.</span>
    </label>
    <button type="submit">Create account</button>
    <p class="alt">Already have an account? <a href="/login">Sign in</a></p>
  </form>
</body>
</html>
