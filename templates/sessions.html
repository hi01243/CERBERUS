<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CERBERUS - Sessions</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root { color-scheme: dark; --bg:#10151d; --surface:#171f2a; --raised:#202b38; --line:#303c4a; --text:#edf1f4; --muted:#9aa8b4; --green:#87b89a; --amber:#efb84d; --red:#e07971; }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--text); font:14px/1.5 'Plus Jakarta Sans',sans-serif; }
  header { min-height:64px; padding:12px clamp(18px,4vw,56px); display:flex; align-items:center; justify-content:space-between; gap:16px; border-bottom:1px solid var(--line); background:#141b24; }
  .brand { display:flex; align-items:center; gap:12px; font-weight:700; letter-spacing:.04em; }
  .brand-mark { width:24px; height:24px; border:2px solid var(--green); border-radius:7px 7px 7px 2px; transform:rotate(-8deg); }
  .header-actions { display:flex; align-items:center; gap:12px; color:var(--muted); font-size:12px; }
  .header-actions a { color:var(--text); text-decoration:none; }
  button, input { font:inherit; }
  button, .button { display:inline-flex; justify-content:center; align-items:center; gap:8px; min-height:38px; border:1px solid var(--line); border-radius:5px; padding:8px 13px; background:var(--raised); color:var(--text); text-decoration:none; cursor:pointer; }
  button:hover, .button:hover { border-color:var(--green); }
  button.primary { color:#142019; background:var(--green); border-color:var(--green); font-weight:700; }
  button:disabled { opacity:.55; cursor:default; }
  main { width:min(1120px,calc(100% - 36px)); margin:36px auto 64px; }
  .intro { display:grid; grid-template-columns:minmax(0,1fr) auto; gap:24px; align-items:end; padding-bottom:24px; border-bottom:1px solid var(--line); }
  .eyebrow { margin:0 0 8px; color:var(--green); font:11px 'JetBrains Mono',monospace; letter-spacing:.08em; text-transform:uppercase; }
  h1 { margin:0; font-size:30px; line-height:1.15; font-weight:600; }
  .sub { margin:8px 0 0; color:var(--muted); }
  .start-actions { display:flex; gap:8px; align-items:center; flex-wrap:wrap; }
  .new-session { display:flex; gap:8px; margin:20px 0 28px; }
  .new-session input, .search { min-width:0; border:1px solid var(--line); border-radius:5px; padding:9px 11px; background:var(--surface); color:var(--text); }
  .new-session input { width:min(340px,60vw); }
  .notice { min-height:22px; color:var(--muted); margin:8px 0; font-size:12px; }
  .toolbar { display:flex; align-items:center; justify-content:space-between; gap:14px; margin:22px 0 10px; }
  h2 { margin:0; font-size:15px; font-weight:600; }
  .search { width:min(260px,48vw); }
  .session-list { border-top:1px solid var(--line); }
  .session-row { display:grid; grid-template-columns:minmax(200px,1.5fr) minmax(135px,.9fr) minmax(135px,.8fr) minmax(150px,1fr) auto auto; gap:20px; align-items:center; padding:16px 10px; border-bottom:1px solid var(--line); }
  .session-row:hover { background:rgba(135,184,154,.06); }
  .session-folder-link { color:inherit; text-decoration:none; min-width:0; }
  .session-open { color:var(--green); font-size:12px; white-space:nowrap; text-decoration:none; }
  .session-delete { min-height:32px; padding:5px 9px; color:var(--red); border-color:#6a3d40; font-size:11px; white-space:nowrap; }
  .session-delete:disabled { color:var(--muted); border-color:var(--line); }
  .folder-title { display:flex; align-items:center; gap:12px; min-width:0; }
  .folder-icon { position:relative; width:24px; height:17px; flex:none; border:1px solid var(--amber); border-radius:3px; }
  .folder-icon:before { content:''; position:absolute; top:-5px; left:1px; width:10px; height:5px; border:1px solid var(--amber); border-bottom:0; border-radius:3px 3px 0 0; }
  .session-name { overflow:hidden; text-overflow:ellipsis; white-space:nowrap; font-weight:600; }
  .current { display:block; color:var(--green); font:10px 'JetBrains Mono',monospace; text-transform:uppercase; }
  .metric { color:var(--muted); font-size:12px; }
  .metric strong { color:var(--text); font:500 13px 'JetBrains Mono',monospace; }
  .file-preview { overflow:hidden; color:var(--muted); font-size:11px; text-overflow:ellipsis; white-space:nowrap; }
  .open-label { color:var(--green); font-size:12px; white-space:nowrap; }
  .empty { padding:34px 8px; color:var(--muted); }
  @media(max-width:760px) { .intro { grid-template-columns:1fr; align-items:start; } .session-row { grid-template-columns:repeat(2,minmax(0,1fr)); gap:8px 12px; } .folder-title,.file-preview { grid-column:1/-1; } .session-open { text-align:right; } .header-actions { gap:8px; } }
  @media(max-width:480px) { .header-actions .user-name { display:none; } .new-session { flex-direction:column; } .new-session input { width:100%; } .start-actions > * { flex:1; } h1 { font-size:26px; } }
</style>
</head>
<body>
<header>
  <div class="brand"><span class="brand-mark" aria-hidden="true"></span><span>CERBERUS</span></div>
  <nav class="header-actions" aria-label="Account">
    <span class="user-name">{{ session.get('username', '-') }}</span>
    <a href="/security/mfa">{% if mfa_enabled %}Manage MFA{% else %}Enable faster MFA{% endif %}</a>
    <form action="/logout" method="post"><button type="submit">Sign out</button></form>
  </nav>
</header>
<main>
  <section class="intro">
    <div>
      <p class="eyebrow">Exam archive</p>
      <h1>Sessions</h1>
      <p class="sub">Browse recordings and review flagged incidents by session.</p>
    </div>
    <div class="start-actions">
      <button class="primary" id="start-monitoring" type="button">{% if monitoring_active %}Monitoring active{% else %}Start monitoring{% endif %}</button>
      <a class="button" href="/monitor">Open monitor</a>
    </div>
  </section>
  <p class="notice" id="action-notice" role="status" aria-live="polite"></p>
  <form class="new-session" id="new-session-form">
    <input id="session-name" name="name" maxlength="64" placeholder="New session name" required>
    <button type="submit">Create session and start</button>
  </form>
  <div class="toolbar">
    <h2>All sessions</h2>
    <input class="search" id="session-search" type="search" placeholder="Search sessions" aria-label="Search sessions">
  </div>
  <div class="session-list" id="session-list" aria-live="polite"><div class="empty">Loading sessions...</div></div>
</main>
<script>
const currentSession = {{ current_session|tojson }};
const monitoringActive = {{ monitoring_active|tojson }};
const mfaEnabled = {{ mfa_enabled|tojson }};
const list = document.getElementById('session-list');
const notice = document.getElementById('action-notice');
let sessions = [];

function openSessionUrl(id) { return `/review?session_id=${encodeURIComponent(id)}`; }
function renderSessions() {
  const query = document.getElementById('session-search').value.trim().toLowerCase();
  const visible = sessions.filter(item => item.session_id.toLowerCase().includes(query));
  list.replaceChildren();
  if (!visible.length) {
    const empty = document.createElement('div');
    empty.className = 'empty';
    empty.textContent = sessions.length ? 'No sessions match that search.' : 'No sessions yet. Create a session to get started.';
    list.append(empty);
    return;
  }
  for (const item of visible) {
    const row = document.createElement('div');
    row.className = 'session-row';
    const link = document.createElement('a');
    link.className = 'session-folder-link';
    link.href = openSessionUrl(item.session_id);
    const folder = document.createElement('div');
    folder.className = 'folder-title';
    const icon = document.createElement('span');
    icon.className = 'folder-icon';
    icon.setAttribute('aria-hidden', 'true');
    const title = document.createElement('span');
    title.className = 'session-name';
    title.textContent = item.session_id;
    if (item.session_id === currentSession) {
      const current = document.createElement('small');
      current.className = 'current';
      current.textContent = 'Current session';
      title.append(current);
    }
    folder.append(icon, title);
    const recordings = document.createElement('span');
    recordings.className = 'metric';
    recordings.innerHTML = `<strong>${item.recording_count}</strong> recordings`;
    const flags = document.createElement('span');
    flags.className = 'metric';
    flags.innerHTML = `<strong>${item.flag_count}</strong> flags`;
    const preview = document.createElement('span');
    preview.className = 'file-preview';
    preview.textContent = item.recordings.slice(0, 2).map(file => file.name).join('  /  ') || 'No recordings yet';
    const open = document.createElement('a');
    open.className = 'session-open';
    open.href = openSessionUrl(item.session_id);
    open.textContent = 'Open →';
    const remove = document.createElement('button');
    remove.className = 'session-delete';
    remove.type = 'button';
    remove.textContent = item.session_id === currentSession && monitoringActive ? 'Pause to delete' : 'Delete';
    remove.disabled = item.session_id === currentSession && monitoringActive;
    remove.addEventListener('click', () => deleteSession(item.session_id, remove));
    link.append(folder);
    row.append(link, recordings, flags, preview, open, remove);
    list.append(row);
  }
}

async function deleteSession(sessionId, button) {
  if (!mfaEnabled) {
    if (confirm('Enable authenticator MFA before deleting sessions?')) location.href = '/security/mfa';
    return;
  }
  if (!confirm(`Permanently delete all recordings and flags for "${sessionId}"?`)) return;
  button.disabled = true;
  notice.textContent = 'Confirming deletion...';
  try {
    const code = prompt('Enter the current six-digit code from your authenticator app:');
    if (!code || !/^\d{6}$/.test(code.trim())) { button.disabled = false; notice.textContent = 'Deletion cancelled.'; return; }
    const confirmation = prompt(`Type the session name exactly to confirm deletion:\n${sessionId}`);
    if (confirmation !== sessionId) { button.disabled = false; notice.textContent = 'Session name did not match; deletion cancelled.'; return; }
    const response = await fetch(`/sessions/${encodeURIComponent(sessionId)}`, {
      method: 'DELETE', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ code: code.trim(), confirm: confirmation })
    });
    const result = await response.json();
    if (!response.ok) {
      if (result.setup_mfa && confirm(`${result.message}\n\nOpen MFA setup now?`)) {
        location.href = '/security/mfa';
        return;
      }
      throw new Error(result.message || 'Could not delete session.');
    }
    notice.textContent = `Deleted ${sessionId}.`;
    if (sessionId === currentSession) { location.reload(); return; }
    await loadSessions();
  } catch (error) {
    notice.textContent = error.message || 'Could not delete session.';
    button.disabled = false;
  }
}

async function loadSessions() {
  try {
    const response = await fetch('/sessions');
    if (!response.ok) throw new Error('Could not load sessions.');
    sessions = await response.json();
    renderSessions();
  } catch (error) {
    list.innerHTML = '<div class="empty">Could not load sessions. Refresh to try again.</div>';
  }
}

async function startMonitoring() {
  notice.textContent = 'Starting monitoring...';
  const response = await fetch('/start_monitoring', { method: 'POST' });
  const result = await response.json();
  if (!response.ok) { notice.textContent = result.message || 'Could not start monitoring.'; return; }
  location.href = '/monitor';
}

document.getElementById('start-monitoring').addEventListener('click', () => {
  if (monitoringActive) { location.href = '/monitor'; return; }
  startMonitoring().catch(() => { notice.textContent = 'Could not start monitoring.'; });
});
document.getElementById('session-search').addEventListener('input', renderSessions);
document.getElementById('new-session-form').addEventListener('submit', async event => {
  event.preventDefault();
  const name = document.getElementById('session-name').value.trim();
  if (!name) return;
  notice.textContent = 'Creating session...';
  try {
    const response = await fetch('/session/new', {
      method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ name })
    });
    const result = await response.json();
    if (!response.ok) { notice.textContent = result.message || 'Could not create session.'; return; }
    await startMonitoring();
  } catch (error) {
    notice.textContent = 'Could not create or start the session.';
  }
});
loadSessions();
</script>
</body>
</html>
